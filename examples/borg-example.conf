# This is an example of a local backup using borg.
# Borg (https://borgbackup.readthedocs.io/) must be installed for this to work.
#
# Before the first backup, a few steps are required.
#
# 1) Create a keyfile for your backup. Borg reads its passphrase from the
#    BORG_PASSPHRASE environment variable. Netbackup sets that variable
#    automatically from the "keyfile" configuration option below, so the same
#    keyfile can be used both here (for the backup) and to initialize the
#    repository. Keep the keyfile in a safe location with restrictive
#    permissions (e.g: chmod 400). If you're feeling lazy, use the commands
#    below to create a decent random passphrase:
#
#    $ mkdir -p $HOME/secrets
#    $ dd if=/dev/urandom bs=1k | base64 | head -1 | cut -c 1-32 \
#      > $HOME/secrets/borgpass
#    $ chmod 400 $HOME/secrets/borgpass
#
# 2) Initialize your borg repository, using the SAME keyfile created above
#    (so the passphrase matches at backup time). Netbackup will not initialize
#    the repo automatically (to avoid data loss) and backups will fail if the
#    repo is not initialized. To initialize a local repository, use something
#    like:
#
#    $ export BORG_PASSPHRASE=$(cat $HOME/secrets/borgpass)
#    $ borg init --encryption=repokey-blake2 /dir/of/backups/borg
#
#    "repokey-blake2" is one of several encryption modes borg offers; pick the
#    one that fits your needs. See the borg documentation for details.

name = "borg-local"
transport = "borg"
source_dir = "/dir/of/data/in/hard/drive"

# Destination borg repository (must already be initialized, see step 2 above).
dest_dir = "/dir/of/backups/borg"

# The keyfile used both to initialize the repository (above) and, at backup
# time, to set BORG_PASSPHRASE automatically. Adjust the path to match
# your secret file created in step 1.
keyfile = "/home/password/borg.pass"

# Keep 10 days worth of archives, then prune and compact.
expire_days = 10

# Exclude some directories (one pattern per line in the configuration file).
# Patterns follow borg's own syntax (see the borg patterns documentation),
# not rsync's or rclone's.
exclude = [
  "/dir/of/data/in/hard/drive/cache",
  "/dir/of/data/in/hard/drive/tmp",
]
